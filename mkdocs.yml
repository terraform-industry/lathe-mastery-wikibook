site_name: The Lathe Mastery Wiki Book
site_author: Johanness A. Nilsson
site_description: A comprehensive guide to metal lathe operation, from beginer to master
docs_dir: docs
site_dir: site
repo_url: https://github.com/terraform-industry/lathe-mastery-wikibook
repo_name: terraform-industry/lathe-mastery-wikibook

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - tags

markdown_extensions:
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.smartsymbols

nav:
  - Home: index.md
  - 01. Foundations:
    - 1.1 The Sacred Contract: 01-foundations/01-sacred-contract.md
    - 1.2 Core Principles: 01-foundations/02-core-principles.md
    - 1.3 Machine Anatomy: 01-foundations/03-machine-anatomy.md
  - 02. Machine-Specific Guides:
    - 2.1 Cincinnati 10-inch Tray-Top: 02-machine-guides/01-cincinnati-10in-tray-top.md
    - 2.2 Cincinnati 15-inch Tray-Top: 02-machine-guides/02-cincinnati-15in-tray-top.md
  - 03. Tool Language:
    - 3.1 Tool Materials: 03-tool-language/01-tool-materials.md
    - 3.2 Tool Geometry: 03-tool-language/02-geometry-basics.md
    - 3.3 Grinding Tools: 03-tool-language/03-grinding-tools.md
    - 3.4 Tool Selection: 03-tool-language/04-tool-selection.md
  - 04. Workshop Ecosystem:
    - 4.1 Material Selection: 04-workshop-ecosystem/01-material-selection.md
    - 4.2 Lubricants & Chemicals: 04-workshop-ecosystem/02-lubricants-chemicals.md
  - 05. Fundamental Operations:
    - 5.1 Facing: 05-fundamental-operations/01-facing.md
    - 5.2 Turning Basics: 05-fundamental-operations/02-turning-basics.md
    - 5.3 Turning Shoulders: 05-fundamental-operations/03-turning-shoulders.md
    - 5.4 Supporting Work: 05-fundamental-operations/04-supporting-work.md
  - 06. Precision Measurement:
    - 6.1 Calipers & Micrometers: 06-precision-measurement/01-calipers-micrometers.md
    - 6.2 Dial Indicators: 06-precision-measurement/02-indicators.md
    - 6.3 Specialized Gauges: 06-precision-measurement/03-specialized-gauges.md
  - 07. Advanced Operations:
    - 7.1 Drilling: 07-advanced-operations/01-drilling.md
    - 7.2 Boring: 07-advanced-operations/02-boring.md
    - 7.3 Trepanning: 07-advanced-operations/03-trepanning.md
  - 08. Threading:
    - 8.1 Taps & Dies: 08-threading/01-taps-and-dies.md
    - 8.2 Single-Point Threading: 08-threading/02-single-point-threading.md
    - 8.3 Internal Threading: 08-threading/03-internal-threading.md
  - 09. Critical Operations:
    - 9.1 Parting: 09-critical-operations/01-parting.md
    - 9.2 Surface Finish: 09-critical-operations/02-surface-finish.md
    - 9.3 Speeds & Feeds: 09-critical-operations/03-speeds-and-feeds.md
  - 10. Troubleshooting:
    - 10.1 Defeating Chatter: 10-troubleshooting/01-defeating-chatter.md
    - 10.2 Deburring: 10-troubleshooting/02-deburring.md
  - 11. Advanced Techniques:
    - 11.1 Radius Turning: 11-advanced-techniques/01-radius-turning.md
    - 11.2 Project Planning: 11-advanced-techniques/02-project-planning.md
  - Contributing: CONTRIBUTING.md
  - Authors: AUTHORS.md
  - Changelog: CHANGELOG.md
  - License: LICENSE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/terraform-industry/lathe-mastery-wikibook

